server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /stonksup/;
    }

    location /stonksup/ {
        try_files $uri $uri/ /stonksup/index.html;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
