name: stonksup

services:
  database:
    image: ${STONKSUP_DATABASE_IMAGE:-ccr.ccs.tencentyun.com/jehan-stonksup/stonksup-pgvector:0.8.2-pg17-alpine}
    container_name: stonksup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stonksup
      POSTGRES_USER: stonksup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - stonksup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonksup -d stonksup"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${STONKSUP_PYTHON_BASE_IMAGE:-mirror.ccs.tencentyun.com/library/python:3.13-slim}
        PIP_INDEX_URL: ${STONKSUP_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${STONKSUP_BACKEND_IMAGE:-ccr.ccs.tencentyun.com/jehan-stonksup/stonksup-backend}:${IMAGE_TAG:-latest}
    container_name: stonksup-backend
    restart: unless-stopped
    environment:
      STONKSUP_ENVIRONMENT: production
      STONKSUP_BUILD_SHA: ${IMAGE_TAG:-latest}
      STONKSUP_DATABASE_URL: postgresql+psycopg://stonksup:${POSTGRES_PASSWORD}@database:5432/stonksup
      STONKSUP_MARKET_DATA_PROVIDER: ${STONKSUP_MARKET_DATA_PROVIDER:-twelvedata}
      STONKSUP_TWELVE_DATA_API_KEY: ${STONKSUP_TWELVE_DATA_API_KEY:-}
      STONKSUP_MARKET_DATA_TIMEOUT_SECONDS: ${STONKSUP_MARKET_DATA_TIMEOUT_SECONDS:-12}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${STONKSUP_NODE_BASE_IMAGE:-mirror.ccs.tencentyun.com/library/node:22-alpine}
        NGINX_BASE_IMAGE: ${STONKSUP_NGINX_BASE_IMAGE:-mirror.ccs.tencentyun.com/library/nginx:1.28-alpine}
        NPM_REGISTRY: ${STONKSUP_NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ${STONKSUP_IMAGE:-ccr.ccs.tencentyun.com/jehan-stonksup/stonksup-web}:${IMAGE_TAG:-latest}
    container_name: stonksup-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${STONKSUP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  stonksup-postgres:
