name: stonksup

services:
  web:
    image: ${STONKSUP_IMAGE:-ghcr.io/jehanrio/stonksup}:${IMAGE_TAG:-latest}
    container_name: stonksup-web
    restart: unless-stopped
    ports:
      - "${STONKSUP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
