name: stonksup-dev

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stonksup-backend-dev
    restart: unless-stopped
    environment:
      STONKSUP_ENVIRONMENT: development
      STONKSUP_BUILD_SHA: local-docker
      STONKSUP_DATABASE_URL: sqlite+pysqlite:////tmp/stonksup.db
      STONKSUP_CORS_ORIGINS: '["http://127.0.0.1:4175","http://localhost:3000"]'
    ports:
      - "${STONKSUP_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
