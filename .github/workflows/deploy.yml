name: Build and deploy container

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_NAME: ccr.ccs.tencentyun.com/jehan-stonksup/stonksup-web
  BACKEND_IMAGE_NAME: ccr.ccs.tencentyun.com/jehan-stonksup/stonksup-backend
  DATABASE_IMAGE_NAME: ccr.ccs.tencentyun.com/jehan-stonksup/stonksup-pgvector
  DEPLOY_DIR: /root/workspace/stonksup

jobs:
  seed_tcr:
    name: Seed Tencent TCR from production cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/stonksup
          chmod 600 ~/.ssh/stonksup
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Seed images from production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          printf '%s' "$TCR_PASSWORD" | ssh -i ~/.ssh/stonksup \
            "$SERVER_USER@$SERVER_HOST" \
            "docker login '$TCR_REGISTRY' -u '$TCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/stonksup "$SERVER_USER@$SERVER_HOST" 'bash -s' <<EOF
          set -Eeuo pipefail
          web_image=\$(docker inspect --format '{{.Image}}' stonksup-web)
          backend_image=\$(docker inspect --format '{{.Image}}' stonksup-backend)
          database_image=\$(docker inspect --format '{{.Image}}' stonksup-db)
          docker tag "\$web_image" "$IMAGE_NAME:${{ github.sha }}"
          docker tag "\$web_image" "$IMAGE_NAME:latest"
          docker tag "\$backend_image" "$BACKEND_IMAGE_NAME:${{ github.sha }}"
          docker tag "\$backend_image" "$BACKEND_IMAGE_NAME:latest"
          docker tag "\$database_image" "$DATABASE_IMAGE_NAME:0.8.2-pg17-alpine"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          docker push "$BACKEND_IMAGE_NAME:${{ github.sha }}"
          docker push "$BACKEND_IMAGE_NAME:latest"
          docker push "$DATABASE_IMAGE_NAME:0.8.2-pg17-alpine"
          EOF

  build:
    name: Test, build, and publish
    needs: seed_tcr
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Test backend and migrations
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build optimized pgvector image
        uses: docker/build-push-action@v6
        with:
          context: database
          push: true
          tags: ${{ env.DATABASE_IMAGE_NAME }}:0.8.2-pg17-alpine
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=database
          cache-to: type=gha,mode=max,scope=database
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/stonksup
          chmod 600 ~/.ssh/stonksup
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_USER"
          ssh -i ~/.ssh/stonksup "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_DIR'"
          scp -i ~/.ssh/stonksup compose.yaml deploy/server-deploy.sh \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/"

      - name: Authenticate server to Tencent TCR
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          printf '%s' "$TCR_PASSWORD" | ssh -i ~/.ssh/stonksup \
            "$SERVER_USER@$SERVER_HOST" \
            "docker login '$TCR_REGISTRY' -u '$TCR_USERNAME' --password-stdin"

      - name: Deploy full stack
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/stonksup "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_DIR' && chmod +x server-deploy.sh && IMAGE_TAG='${{ github.sha }}' ./server-deploy.sh"
